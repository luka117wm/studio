# Референс (устав M4, решение 10; принцип 11): сходство VO действующего плана с текстом субтитров
# референса — доля n-грамм слов плана, которые встречаются в субтитрах. Выше порога — «Утвердить план»
# отказывает со списком совпавших фраз. Меняется здесь, код не трогается; правила — docs/research.md,
# «Референс». Проверка при старте: ngram 2…12, порог строго между 0 и 1, иначе бэкенд не стартует.

# Длина n-граммы в словах: 5 — фраза, а не случайное совпадение пары слов.
ngram: 5
# Порог доли совпавших n-грамм (в артборде — 10 %).
max_similarity: 0.10
