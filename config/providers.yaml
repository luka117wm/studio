# Маршруты «этап → профиль качества → провайдер → модель» (принцип 5). ID моделей — только здесь.
# Правила и как менять — docs/providers.md; цены каждой модели каталога — config/pricing.yaml
# (без цены бэкенд не стартует). Профиль меняет только выбор модели по умолчанию; выбор
# пользователя на пачку или кадр — ключ каталога или ID модели из каталога этапа.

default_profile: standard

# Откуда план, идеи и разбор референса: bridge — мост через чат (промпт копируется в claude.ai,
# ответ вставляется в приложение), api — Anthropic API. Без ANTHROPIC_API_KEY api недоступен, и
# работает мост. Правила — docs/bridge.md.
plan_source: bridge

# CLAUDE.md, «Чего не делать»: API этих моделей закрываются осенью 2026. Шаблоны fnmatch без
# учёта регистра; модель из каталога, попавшая под шаблон, — ошибка старта.
forbidden_models:
  - "gemini-2.5-flash-image*"
  - "sora-2*"

stages:
  # Исследование и факт-чек (M4): текст + веб-поиск.
  research:
    kind: text
    catalog:
      sonnet-5: {provider: anthropic, model: claude-sonnet-5}
      opus-5: {provider: anthropic, model: claude-opus-5}
      opus-5-5: {provider: anthropic, model: claude-opus-5-5}
    profiles: {economy: sonnet-5, standard: opus-5, premium: opus-5-5}

  # Сценарий и director.json (M4).
  script:
    kind: text
    catalog:
      sonnet-5: {provider: anthropic, model: claude-sonnet-5}
      opus-5: {provider: anthropic, model: claude-opus-5}
      opus-5-5: {provider: anthropic, model: claude-opus-5-5}
    profiles: {economy: sonnet-5, standard: opus-5, premium: opus-5-5}

  # Кадры (M6). `size` выбирает цену: 1K, 2K, 4K. `max_refs` — референсов за вызов: у моделей
  # Gemini 3 до 14 (ai.google.dev, «Image generation»; разбивка по видам — docs/providers.md).
  # `label` — подпись в выборе модели на экране «Генерация» (M6.2).
  images:
    kind: image
    catalog:
      nb2-lite:
        provider: gemini
        model: gemini-3.1-flash-lite-image
        params: {size: 1K}
        max_refs: 14
        label: Nano Banana 2 Lite
      nb2:
        provider: gemini
        model: gemini-3.1-flash-image
        params: {size: 1K}
        max_refs: 14
        label: Nano Banana 2
      nb2-2k:
        provider: gemini
        model: gemini-3.1-flash-image
        params: {size: 2K}
        max_refs: 14
        label: Nano Banana 2 · 2K
      nb-pro:
        provider: gemini
        model: gemini-3-pro-image
        params: {size: 2K}
        max_refs: 14
        label: Nano Banana Pro
    profiles: {economy: nb2-lite, standard: nb2, premium: nb-pro}

  # Листы опорных портретов и кадры стиля (M5.4): эталон внешности делается один раз — одна модель
  # Pro во всех профилях (устав M5, решение 5).
  anchors:
    kind: image
    catalog:
      nb-pro-1k: {provider: gemini, model: gemini-3-pro-image, params: {size: 1K}, max_refs: 14}
    profiles: {economy: nb-pro-1k, standard: nb-pro-1k, premium: nb-pro-1k}

  # Проверка анахронизмов на готовых кадрах (M6.6; устав M6, решение 7): вопрос о картинке —
  # миниатюра версии и список `forbidden` эпохи, ответ строго JSON. Дешёвая модель, одна во всех
  # профилях: проверка дешевле кадра в десятки раз. Параметры меняют цену и результат:
  # `media_resolution: low` — 280 токенов на картинку, `thinking_level: minimal` — рассуждение на
  # минимуме, `max_output_tokens` — лимит ответа (короткий JSON) и по нему оценка сверху: ~$0.0009
  # за кадр, по факту ~$0.0004. Обрезанный ответ не разбирается — проверка `failed`.
  check:
    kind: vision
    catalog:
      flash-lite:
        provider: gemini
        model: gemini-3.5-flash-lite
        params: {media_resolution: low, thinking_level: minimal, max_output_tokens: 256}
    profiles: {economy: flash-lite, standard: flash-lite, premium: flash-lite}

  # Голос (M7). Порядок выбора модели голоса — docs/providers.md.
  voice:
    kind: speech
    catalog:
      flash-v2-5: {provider: elevenlabs, model: eleven_flash_v2_5}
      multilingual-v2: {provider: elevenlabs, model: eleven_multilingual_v2}
      v3: {provider: elevenlabs, model: eleven_v3}
    profiles: {economy: flash-v2-5, standard: multilingual-v2, premium: v3}

  # Анимация кадров (M8): путь ещё не выбран (docs/api_keys.md, «Анимация кадров»). Каталог нужен
  # уже сейчас — по нему считается лимит «анимация на выпуск». `resolution` выбирает цену.
  animate:
    kind: video
    catalog:
      veo-lite: {provider: gemini, model: veo-3.1-lite-generate-preview, params: {resolution: 720p}}
      veo-fast: {provider: gemini, model: veo-3.1-fast-generate-preview, params: {resolution: 720p}}
      veo: {provider: gemini, model: veo-3.1-generate-preview, params: {resolution: 720p}}
    profiles: {economy: veo-lite, standard: veo-lite, premium: veo-fast}
